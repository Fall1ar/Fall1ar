<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="390" viewBox="0 0 1200 390" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Omni — local desktop plugin manager</title>
  <desc id="desc">Omni combines a plugin hub, task manager, and themes with a Python plugin runtime connected to a Tauri and Rust core using JSON Lines.</desc>
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" stroke="#FFFFFF" stroke-opacity=".05"/>
    </pattern>
  </defs>
  <rect width="1200" height="390" fill="#000000"/>
  <rect width="1200" height="390" fill="url(#grid)"/>
  <rect x="20.5" y="18.5" width="1159" height="353" stroke="#30363D"/>
  <path d="M42 55H1158M42 344H1158" stroke="#30363D"/>
  <text x="44" y="43" fill="#FFFFFF" font-family="Consolas,Menlo,monospace" font-size="12" letter-spacing="2">02 / FEATURED SYSTEM</text>
  <text x="1156" y="43" text-anchor="end" fill="#777777" font-family="Consolas,Menlo,monospace" font-size="10" letter-spacing="1.5">WINDOWS  /  TAURI V2</text>
  <text x="56" y="116" fill="#FFFFFF" font-family="Consolas,Menlo,monospace" font-size="32" letter-spacing="-1">Omni</text>
  <text x="57" y="145" fill="#B3B3B3" font-family="Consolas,Menlo,monospace" font-size="13">A local desktop plugin manager.</text>
  <text x="57" y="174" fill="#888888" font-family="Consolas,Menlo,monospace" font-size="11">Discover, run, manage, and organize local plugins</text>
  <text x="57" y="194" fill="#888888" font-family="Consolas,Menlo,monospace" font-size="11">from one native desktop workspace.</text>
