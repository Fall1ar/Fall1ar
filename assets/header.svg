<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">inuisaat-crypto — personal systems interface</title>
  <desc id="desc">Animated monochrome blueprint grid, profile title, orbital reticle, and perimeter signal.</desc>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" stroke="#FFFFFF" stroke-opacity=".065"/>
    </pattern>
    <pattern id="fine" width="8" height="8" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r=".65" fill="#FFFFFF" fill-opacity=".09"/>
    </pattern>
    <style>
      .coordinate { animation: breathe 6s ease-in-out infinite; }
      .radar { transform-box: view-box; transform-origin: 1000px 176px; animation: orbit 24s linear infinite; }
      .frame-run { stroke-dasharray: 52 2856; animation: perimeter 12s linear infinite; }
      .cursor { animation: blink 1.2s steps(2, start) infinite; }
      @keyframes breathe { 0%, 100% { opacity: .16; } 50% { opacity: .52; } }
      @keyframes orbit { to { transform: rotate(360deg); } }
      @keyframes perimeter { to { stroke-dashoffset: -2908; } }
      @keyframes blink { 50% { opacity: 0; } }
      @media (prefers-reduced-motion: reduce) {
        .coordinate, .radar, .frame-run, .cursor { animation: none; }
      }
    </style>
  </defs>
  <rect width="1200" height="360" fill="#000000"/>
  <rect width="1200" height="360" fill="url(#grid)"/>
  <rect width="1200" height="360" fill="url(#fine)" opacity=".25"/>
  <rect x="28.5" y="24.5" width="1143" height="311" stroke="#FFFFFF" stroke-opacity=".42"/>
  <rect class="frame-run" x="28.5" y="24.5" width="1143" height="311" stroke="#FFFFFF" stroke-width="1.5"/>
  <path d="M48 54V42H72M1128 42H1152V66M48 294V318H72M1128 318H1152V294" stroke="#FFFFFF" stroke-width="1"/>
  <path d="M48 78H1152M48 280H1152" stroke="#FFFFFF" stroke-opacity=".18"/>
  <path class="coordinate" d="M48 72H1152M900 78V280" stroke="#FFFFFF" stroke-opacity=".36"/>
  <text x="72" y="65" fill="#B3B3B3" font-family="Consolas,Menlo,monospace" font-size="10" letter-spacing="2">INUISAAT-CRYPTO  /  PROFILE SYSTEM</text>
  <text x="1128" y="65" text-anchor="end" fill="#777777" font-family="Consolas,Menlo,monospace" font-size="10" letter-spacing="1.5">BUILD  /  01</text>
  <text x="72" y="157" fill="#FFFFFF" font-family="Consolas,Menlo,monospace" font-size="42" font-weight="600" letter-spacing="-1.8">inuisaat-crypto</text>
  <text x="74" y="193" fill="#B3B3B3" font-family="Consolas,Menlo,monospace" font-size="13" letter-spacing=".15">SOFTWARE  /  AUTOMATION  /  SYSTEMS</text>
  <path d="M74 222H310" stroke="#777777"/>
  <circle cx="74" cy="222" r="2" fill="#FFFFFF"/>
  <text x="74" y="251" fill="#888888" font-family="Consolas,Menlo,monospace" font-size="10" letter-spacing="1.2">LOCAL TOOLS. CLEAR SIGNAL.</text>
  <g>
    <circle cx="1000" cy="176" r="70" stroke="#FFFFFF" stroke-opacity=".32"/>
    <circle cx="1000" cy="176" r="54" stroke="#FFFFFF" stroke-opacity=".16" stroke-dasharray="2 7"/>
    <circle cx="1000" cy="176" r="34" stroke="#FFFFFF" stroke-opacity=".28"/>
    <path d="M916 176H1084M1000 92V260" stroke="#FFFFFF" stroke-opacity=".28"/>
    <path d="M940 116L1060 236M1060 116L940 236" stroke="#FFFFFF" stroke-opacity=".1"/>
    <g class="radar">
      <path d="M1000 176L1000 102" stroke="#FFFFFF" stroke-opacity=".85" stroke-width="1.5"/>
      <path d="M1000 176L1052 124" stroke="#FFFFFF" stroke-opacity=".28"/>
      <circle cx="1000" cy="176" r="5" fill="#FFFFFF"/>
    </g>
    <path d="M1000 89V99M1000 253V263M913 176H923M1077 176H1087" stroke="#FFFFFF" stroke-width="2"/>
    <text x="1000" y="282" text-anchor="middle" fill="#777777" font-family="Consolas,Menlo,monospace" font-size="9" letter-spacing="1.5">SIGNAL / ACTIVE</text>
  </g>
  <text x="72" y="311" fill="#777777" font-family="Consolas,Menlo,monospace" font-size="9" letter-spacing="1.2">COORDINATES  00:01</text>
  <text x="1128" y="311" text-anchor="end" fill="#777777" font-family="Consolas,Menlo,monospace" font-size="9" letter-spacing="1.2">UPLINK <tspan class="cursor">_</tspan></text>
</svg>
