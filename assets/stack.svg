<svg xmlns="http://www.w3.org/2000/svg" width="600" height="320" viewBox="0 0 600 320" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Core stack matrix</title>
  <desc id="desc">A monochrome circuit diagram connecting Python, Rust, Tauri v2, JavaScript, HTML and CSS, and Git.</desc>
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" stroke="#FFFFFF" stroke-opacity=".05"/></pattern>
    <style>
      .wire { stroke-dasharray: 5 7; animation: transmit 7s linear infinite; }
      .packet { animation: packet 3.8s ease-in-out infinite; }
      .delay { animation-delay: -1.9s; }
      @keyframes transmit { to { stroke-dashoffset: -48; } }
      @keyframes packet { 0%, 100% { opacity: .2; } 50% { opacity: 1; } }
      @media (prefers-reduced-motion: reduce) { .wire, .packet { animation: none; } }
    </style>
  </defs>
  <rect width="600" height="320" fill="#000000"/>
  <rect width="600" height="320" fill="url(#grid)"/>
  <rect x="16.5" y="16.5" width="567" height="287" stroke="#303030"/>
  <path d="M34 54H566" stroke="#303030"/>
  <text x="36" y="42" fill="#FFFFFF" font-family="Consolas,Menlo,monospace" font-size="11" letter-spacing="1.5">CORE STACK MATRIX</text>
  <text x="564" y="42" text-anchor="end" fill="#777777" font-family="Consolas,Menlo,monospace" font-size="9" letter-spacing="1.2">DATA BUS / 06 NODES</text>
  <path class="wire" d="M190 103H268V172M190 172H268M190 241H268V172M332 172H410V103M332 172H410M332 172V241H410" stroke="#777777"/>
  <circle class="packet" cx="226" cy="103" r="3" fill="#FFFFFF"/>
  <circle class="packet delay" cx="372" cy="172" r="3" fill="#FFFFFF"/>
  <circle class="packet" cx="269" cy="172" r="4" fill="#FFFFFF"/>
  <path d="M268 172H332" stroke="#FFFFFF" stroke-opacity=".55"/>
  <circle cx="300" cy="172" r="21" fill="#0D1117" stroke="#FFFFFF" stroke-opacity=".65"/>
  <text x="300" y="176" text-anchor="middle" fill="#FFFFFF" font-family="Consolas,Menlo,monospace" font-size="8">CORE</text>
  <g>
    <rect x="40.5" y="80.5" width="150" height="46" fill="#0D1117" stroke="#555555"/>
    <text x="54" y="108" fill="#FFFFFF" font-family="Consolas,Menlo,monospace" font-size="12">PYTHON</text>
    <rect x="40.5" y="149.5" width="150" height="46" fill="#0D1117" stroke="#555555"/>
    <text x="54" y="177" fill="#FFFFFF" font-family="Consolas,Menlo,monospace" font-size="12">RUST</text>
    <rect x="40.5" y="218.5" width="150" height="46" fill="#0D1117" stroke="#555555"/>
    <text x="54" y="246" fill="#FFFFFF" font-family="Consolas,Menlo,monospace" font-size="12">TAURI V2</text>
    <rect x="409.5" y="80.5" width="150" height="46" fill="#0D1117" stroke="#555555"/>
    <text x="423" y="108" fill="#FFFFFF" font-family="Consolas,Menlo,monospace" font-size="12">JAVASCRIPT</text>
    <rect x="409.5" y="149.5" width="150" height="46" fill="#0D1117" stroke="#555555"/>
    <text x="423" y="177" fill="#FFFFFF" font-family="Consolas,Menlo,monospace" font-size="12">HTML / CSS</text>
    <rect x="409.5" y="218.5" width="150" height="46" fill="#0D1117" stroke="#555555"/>
    <text x="423" y="246" fill="#FFFFFF" font-family="Consolas,Menlo,monospace" font-size="12">GIT</text>
  </g>
  <text x="36" y="286" fill="#777777" font-family="Consolas,Menlo,monospace" font-size="8" letter-spacing="1">RUST / DESKTOP CORE</text>
  <text x="564" y="286" text-anchor="end" fill="#777777" font-family="Consolas,Menlo,monospace" font-size="8" letter-spacing="1">PYTHON / WORKERS</text>
</svg>
