  <text id="commit-date" x="330" y="238" fill="#B3B3B3" font-family="Consolas,Menlo,monospace" font-size="10">2026-11-03 UTC</text>
  <text id="commit-message" x="58" y="289" fill="#B3B3B3" font-family="Consolas,Menlo,monospace" font-size="10">feat: add new Studio and Workbench themes with separate layouts and navigation</text>
  <text x="1142" y="289" text-anchor="end" fill="#777777" font-family="Consolas,Menlo,monospace" font-size="8" letter-spacing="1">REPOSITORY SIGNAL</text>
