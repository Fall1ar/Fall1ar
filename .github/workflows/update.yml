name: Update profile graphics

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    paths-ignore:
      - "assets/telemetry.svg"
      - "assets/project-omni.svg"
      - "assets/pulse.svg"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Refresh profile SVGs
        run: python scripts/update_profile.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROFILE_USERNAME: inuisaat-crypto
          OMNI_REPOSITORY: Fall1ar/Omni

      - name: Commit refreshed graphics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/telemetry.svg assets/project-omni.svg assets/pulse.svg
          if git diff --cached --quiet; then
            echo "Profile graphics are already up to date."
          else
            git commit -m "chore: refresh profile graphics"
            git push
          fi
